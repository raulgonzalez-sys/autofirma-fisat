name: autofirma-fisat

on:
  pull_request:
    branches: [fisat]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar desde fisat (X.Y.Z+fisatN); vacío = solo pruebas'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl jq shellcheck desktop-file-utils lintian fakeroot xvfb
      - name: Tests Java
        run: |
          xvfb-run -a mvn -B -ntp -P env-dev,autofirma \
            -pl afirma-ui-core-jse,afirma-simple,afirma-ui-simple-configurator,afirma-ui-core-jse-keystores,afirma-keystores-mozilla -am test \
            -Dtest='AfirmaWebSocketServerTest,SecureSocketUtilsTest,ServiceInvocationManagerTest,TestRestoreConfigFirefox,RestoreConfigLinuxTest,CertificateSelectionPanelTest,TestConfiguratorLinuxUsers,TestConfiguratorFirefoxLinux,TestConfiguratorFirefoxCommon,TestCertUtil,NativeFileDialogsTest,JSEUIManagerNativeDialogsTest,NssLinuxDatabasesTest,NssMultiSlotLoaderTest,NssFirefoxChromeKeyStoreManagerTest,CertificateOriginsTest,RestoreUserLinuxTest,RestoreSystemLinuxTest,FirefoxPoliciesTest,RestoreCommandLinuxTest,RestoreConfigPanelLinuxTest' \
            -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
      - name: Tests de shell
        run: bash afirma-simple-installer/linux/instalador_deb/tests/run.sh

  deb:
    needs: pruebas
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '+fisat')) ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl jq shellcheck desktop-file-utils lintian fakeroot
      - name: Determinar el tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Lanzamiento manual: solo desde fisat; el tag lo crea gh release create
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/fisat ]; then
              echo "La publicación manual solo se lanza sobre fisat (ref: $GITHUB_REF)" >&2
              exit 1
            fi
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "El tag $TAG ya existe" >&2
              exit 1
            fi
          else
            TAG=$GITHUB_REF_NAME
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Validar el tag contra la versión del proyecto
        run: |
          re='^v([0-9]+\.[0-9]+\.[0-9]+)\+fisat([0-9]+)$'
          if ! [[ $TAG =~ $re ]]; then
            echo "Tag no válido '$TAG': se espera vX.Y.Z+fisatN" >&2
            exit 1
          fi
          pom=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "${BASH_REMATCH[1]}" != "$pom" ]; then
            echo "El tag ($TAG) no coincide con la versión del pom ($pom)" >&2
            exit 1
          fi
      - name: Build de JAR
        run: |
          mvn -B -ntp -DskipTests -P env-dev,env-install \
            -pl afirma-simple -am clean package
      - name: Comprobar que las clases salen del reactor
        run: |
          c=es/gob/afirma/standalone/protocol/AfirmaWebSocketServer.class
          cmp <(unzip -p afirma-simple/target/autofirma.jar "$c") afirma-simple/target/classes/"$c"
          echo REACTOR_OK
          cmp <(unzip -p afirma-simple/target/autofirma.jar linux/autofirma.js) afirma-simple-installer/linux/instalador_deb/src/etc/firefox/pref/AutoFirma.js
          echo RECURSO_OK
      - name: Construir y verificar el paquete
        run: |
          D=afirma-simple-installer/linux/instalador_deb
          "$D/construir_deb.sh" "${TAG#v}" dist \
            afirma-simple/target/autofirma.jar
          "$D/verificar_paquete.sh" dist/*.deb
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            origen=(--target "$GITHUB_SHA")
          else
            origen=(--verify-tag)
          fi
          gh release create "$TAG" dist/*.deb dist/*.sha256 \
            "${origen[@]}" --title "$TAG" \
            --notes "AutoFirma ${TAG#v} (fork FISAT)"
